<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="pink">
    <fieldset>
    <legend><h1><center>Student Registration Form</center></h1></legend>
    <form>
        <table width="1050" cellpadding="3" cellspacing="5">
            <tr>
                <td align="left">Roll no:</td>
                <td align="left"><input type="text" size="100"></td>
            </tr>
             <tr>
                <td align="left">Student Name:</td>
                <td align="left"><input type="text" placeholder="First Name" size="47">-<input type="text" size="47" placeholder="last Name"></td>
            </tr>
            <tr>
                <td align="left">Father's Name:</td>
                <td align="left"><input type="text" size="100"></td>
            </tr>
             <tr>
                <td align="left">Date of Birth:</td>
                <td align="left"><input type="text" size="20"  placeholder="Day">-<input type="text" size="20"  placeholder="Month">-<input type="text" size="30"  placeholder="Year">(DD-MM-YYYY)</td>
            </tr>
            <tr>
                <td align="left">Mobile no:</td>
                <td align="left"><input type="text" size="4" value="+91">-<input type="text" size="90"></td>
            </tr>
            <tr>
                <td align="left">Email id:</td>
                <td align="left"><input type="text" size="100"></td>
            </tr>
            <tr>
                <td align="left">Password:</td>
                <td align="left"><input type="password" size="100"></td>
            </tr>
            <tr>
                <td align="left">Gender:</td>
                <td align="left"><input type="radio" name="gender">Male<input type="radio" name="gender">Female </td>
            </tr>
            <tr>
                <td align="left">Department:</td>
                <td align="left"><input type="checkbox">CSE<input type="checkbox">IT<input type="checkbox">ECE<input type="checkbox">Civil<input type="checkbox">Mech</td>
            </tr>
            <tr>
                <td align="left">course:</td>
                <td align="left">
                <select>
                    <option size="100">.............................................................................Select current course...........................................................................</option>
                    <option>C++</option>
                    <option>C</option>
                    <option>BLUE JAVA</option>
                    <option>Python</option>
                    <option>SQL</option>
                    <option>HTML</option>
                    <option>CSS</option>
                    <option>JAVA Script</option>
                </select>
                </td>
            </tr>
            <tr>
                <td align="left">Student photo:</td>
                <td align="left"><button>Choose file</button></td>
            </tr>
            <tr>
                <td align="left">City:</td>
                <td align="left"><input type="text" size="100"></td>
            </tr>
            <tr>
                <td align="left">Address:</td>
                <td align="left"><textarea rows="3" cols="90"></textarea></td>
            </tr>
             <tr>
                <td align="left"></td>
                <td align="center"><button>Register</button></td>
            </tr>
        </table>
    </form>
    </fieldset>
</body>
</html>
